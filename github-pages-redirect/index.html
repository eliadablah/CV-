<!DOCTYPE html>
<!--
  This page goes in my old GitHub Pages repository (eliadablah.github.io).
  It sends every visitor to my new site on AWS, so I only have one real site.
  I only put it there AFTER the AWS site is live. If I do it sooner, it points at nothing.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elikem Adablah &mdash; Cloud &amp; DevOps</title>
<!-- Tells Google that the new address is the real one -->
<link rel="canonical" href="https://cv.eliadablah.com/">
<!-- Sends the visitor to the new site right away -->
<meta http-equiv="refresh" content="0; url=https://cv.eliadablah.com/">
</head>
<body>
  <!-- Shown only if the browser does not follow the redirect -->
  <p>My site has moved to <a href="https://cv.eliadablah.com/">cv.eliadablah.com</a>.</p>
</body>
</html>
